name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu GCC (OpenMP)",  os: ubuntu-24.04, cxx: g++,     flags: "" }
          - { name: "Ubuntu Clang (serial)", os: ubuntu-24.04, cxx: clang++, flags: "-DQK_ENABLE_OPENMP=OFF" }
          - { name: "Ubuntu GCC ASan+UBSan", os: ubuntu-24.04, cxx: g++,     flags: "-DQK_SANITIZE=ON -DQK_ENABLE_OPENMP=OFF -DCMAKE_BUILD_TYPE=Debug" }
          - { name: "Windows MSVC (OpenMP)", os: windows-2022, cxx: "",      flags: "" }
          - { name: "macOS AppleClang",      os: macos-latest, cxx: "",      flags: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Benchmark (smoke)
        shell: bash
        run: |
          if [ -f build/Release/qk-bench.exe ]; then exe=build/Release/qk-bench.exe; else exe=build/qk-bench; fi
          "$exe" --waters 1,2
